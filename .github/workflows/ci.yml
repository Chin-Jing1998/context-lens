name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - 'dist/**'

jobs:
  macos-desktop:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/build-desktop.mjs
      - name: Verify native desktop behavior
        timeout-minutes: 2
        run: '"desktop/build/Context Lens.app/Contents/MacOS/ContextLens" --self-test'
      - run: codesign --verify --deep --strict 'desktop/build/Context Lens.app'
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run test:coverage

  windows-git:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run Windows Git tests
        shell: pwsh
        run: |
          $output = & node --test tests/git.test.js tests/git-runner.test.js 2>&1
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Output $_ }
          if ($exitCode -ne 0) {
            $details = $output -join "`n"
            if ($details.Length -gt 3500) {
              $details = $details.Substring($details.Length - 3500)
            }
            $annotation = $details.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows Git tests failed::$annotation"
            exit $exitCode
          }
